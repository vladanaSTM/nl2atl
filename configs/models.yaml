  # disjoint from the evaluated systems (Meta, Google) for cross-family
  # judge-panel robustness. NOTE: the LLM-judge pipeline currently accepts only
  # provider="azure"; running these as judges requires a local HF judge client.
  # Pin `revision` before the final run for reproducibility (cf. appendix model card).
